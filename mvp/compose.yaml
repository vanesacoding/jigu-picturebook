services:
  web:
    build: .
    env_file: .env
    environment:
      JIGU_DATA_DIR: /data
    ports:
      - "127.0.0.1:4173:4173"
    volumes:
      - jigu-private:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4173/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    command: ["python", "app.py", "worker"]
    env_file: .env
    environment:
      JIGU_DATA_DIR: /data
    volumes:
      - jigu-private:/data
    restart: unless-stopped
volumes:
  jigu-private:
